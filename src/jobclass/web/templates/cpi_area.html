<section class="cpi-area-page" id="cpi-area-page" data-area-code="{{ area_code }}">
    <div class="loading" id="area-loading">Loading CPI area data...</div>
    <div id="area-content" style="display:none;">
        <!-- Breadcrumb -->
        <nav class="breadcrumb" id="cpi-area-breadcrumb" aria-label="CPI area breadcrumb">
            <a href="/cpi">CPI</a>
            <span class="breadcrumb-sep">&#8250;</span>
            <span class="breadcrumb-current" id="area-breadcrumb-name">Area</span>
        </nav>

        <!-- Header -->
        <div class="cpi-member-header">
            <h1 id="area-title"></h1>
            <div class="cpi-member-meta">
                <span class="lineage-badge" id="area-code-badge"></span>
                <span class="lineage-badge" id="area-type-badge"></span>
                <span class="lineage-badge" id="area-freq-badge"></span>
            </div>
        </div>

        <!-- Caveats -->
        <div class="cpi-area-caveats" id="area-caveats"></div>

        <!-- Published members -->
        <div class="cpi-member-section" id="area-members-section">
            <h2>Published Members</h2>
            <p class="section-note">CPI items published in this area — <span id="area-member-count">0</span> members.</p>
            <div class="cpi-area-search">
                <input type="text" id="area-member-filter" placeholder="Filter members..." autocomplete="off">
            </div>
            <ul id="area-members-list" class="cpi-member-list"></ul>
        </div>
    </div>
</section>

<script src="/static/js/cpi_area.js?v=DM1" defer></script>
